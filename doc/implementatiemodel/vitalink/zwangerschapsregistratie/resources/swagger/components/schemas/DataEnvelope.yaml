title: DataEnvelope
type: object
description: De collectie van de uitgewisselde data en zijn metadata elementen.
properties:
  '@id':
    type: string
    format: uri
  '@type':
    type: string
    description: Object type (klasse DataEnvelope)
    pattern: ^DataEnvelope$
  volgende:
    $ref: '#/components/schemas/Link'
  warning:
    type: array
    description: Foutmeldingen die opgetreden zijn bij het afleveren van de data. Foutmeldingen kunnen ook optreden bij HTTP 200 waarbij validatiefouten worden meegegeven zoals MAGDA Uitzonderingen. Lijst van Uitzondering items.
    items:
      $ref: '#/components/schemas/Uitzondering'
    minItems: 1
  data:
    $ref: '#/components/schemas/Zwangerschap'
required:
  - '@type'
  - data
