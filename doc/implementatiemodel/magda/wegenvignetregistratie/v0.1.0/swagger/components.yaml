openapi: 3.0.4
info:
  title: Components of magda wegenvignetregistratie REST
  description: OSLO-conforme REST API voor informatie over wegenvignetregistratie
  version: 0.1.0
components:
  schemas:
    EuroNormCode:
      title: EuroNormCode
      type: object
      description: Enumeratie van EuroNormCode
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    Brandstoftype:
      title: Brandstoftype
      type: object
      description: Enumeratie van Brandstoftype
      properties:
        '@id':
          type: string
          format: uri
      required:
        - '@id'
    Problemdetail.detail:
      title: Problemdetail.detail
      description: Mensleesbare beschrijving van de fout.
      type: string
    Problemdetail.instance:
      title: Problemdetail.instance
      description: 'Verwijzing naar de instantie van het object waarop de fout betrekking heeft. Bijvoorbeeld: de verwijzing naar de request.'
      type: string
      format: uri
    Problemdetail.status:
      title: Problemdetail.status
      description: 'HTTP foutcode. Zoals beschreven in <a href="https://www.rfc-editor.org/rfc/rfc7231">RFC7231</a>. Bijvoorbeeld: 404 voor "Not Found".'
      type: number
      format: int64
    Problemdetail.title:
      title: Problemdetail.title
      description: Korte mensleesbare beschrijving van de fout.
      type: string
    Problemdetail.type:
      title: Problemdetail.type
      description: Aard van de fout.
      type: string
      format: uri
    Problemdetail:
      title: Problemdetail
      type: object
      description: Meer gedetailleerde beschrijving van de fout in een HTTP response.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Problemdetail)
          pattern: ^Problemdetail$
        detail:
          $ref: '#/components/schemas/Problemdetail.detail'
        instance:
          $ref: '#/components/schemas/Problemdetail.instance'
        status:
          $ref: '#/components/schemas/Problemdetail.status'
        title:
          $ref: '#/components/schemas/Problemdetail.title'
        type:
          $ref: '#/components/schemas/Problemdetail.type'
      required:
        - '@type'
        - detail
        - title
        - type
    WegenvignetRegistratieEnvelop.language:
      title: WegenvignetRegistratieEnvelop.language
      description: De taal van het antwoord.
      type: string
      pattern: ^[a-z]{2,3}(-[A-Z]{2})?
    WegenvignetRegistratieEnvelop:
      title: WegenvignetRegistratieEnvelop
      type: object
      description: Enveloppe om wegenvignetregistraties en bijhorende validatiewaarschuwing uit te wisselen.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse WegenvignetRegistratieEnvelop)
          pattern: ^WegenvignetRegistratieEnvelop$
        language:
          $ref: '#/components/schemas/WegenvignetRegistratieEnvelop.language'
        data:
          type: array
          description: De data die overgedragen werd. Lijst van Wegenvignetregistratie items.
          items:
            $ref: '#/components/schemas/Wegenvignetregistratie'
          minItems: 1
        warning:
          type: array
          description: Foutmeldingen die opgetreden zijn bij het afleveren van de data. Foutmeldingen kunnen ook optreden bij HTTP 200 waarbij validatiefouten worden meegegeven zoals MAGDA Uitzonderingen. Lijst van Uitzondering items.
          items:
            $ref: '#/components/schemas/Uitzondering'
          minItems: 1
        '@context':
          type: string
          description: URI of the JSON-LD versioned context file for this response.
          pattern: ^https:\/\/implementatie.data.test-vlaanderen.be\/doc\/implementatiemodel\/magda\/wegenvignetregistratie\/v0.1.0\/context\/wegenvignetregistratie.jsonld$
      required:
        - '@type'
    Concept.code:
      title: Concept.code
      description: Code waarmee het concept binnen de codelijst wordt aangeduid.
      type: string
    Concept.voorkeursnaam:
      title: Concept.voorkeursnaam
      description: Naam waarmee het concept bij voorkeur wordt aangeduid.
      type: string
    Concept:
      title: Concept
      type: object
      description: Idee of begrip.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Concept)
          pattern: ^Concept$
        code:
          $ref: '#/components/schemas/Concept.code'
        voorkeursnaam:
          $ref: '#/components/schemas/Concept.voorkeursnaam'
      required:
        - '@type'
    Registratie:
      title: Registratie
      type: object
      description: Inschrijving van een Voertuig in een nationaal register.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Registratie)
          pattern: ^Registratie$
        nummerplaat:
          $ref: '#/components/schemas/Nummerplaat'
        voertuig:
          $ref: '#/components/schemas/Voertuig'
      required:
        - '@type'
    Nummerplaat:
      title: Nummerplaat
      type: object
      description: Fysieke drager van het registratienummer van het Voertuig.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Nummerplaat)
          pattern: ^Nummerplaat$
        registratienummer:
          $ref: '#/components/schemas/Identificator'
      required:
        - '@type'
    Uitzondering.datum:
      title: Uitzondering.datum
      description: De datum waarop de Uitzondering aangemaakt werd.
      type: string
      format: date-time
    Uitzondering.diagnose:
      title: Uitzondering.diagnose
      description: Een beschrijving waarom de Uitzondering aangemaakt werd.
      type: string
    Uitzondering:
      title: Uitzondering
      type: object
      description: Uitzondering geeft niet-kritieke problemen weer bij het uitwisselen.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Uitzondering)
          pattern: ^Uitzondering$
        datum:
          $ref: '#/components/schemas/Uitzondering.datum'
        diagnose:
          $ref: '#/components/schemas/Uitzondering.diagnose'
        oorsprong:
          $ref: '#/components/schemas/Concept'
        type:
          $ref: '#/components/schemas/Concept'
        omstandigheid:
          $ref: '#/components/schemas/Concept'
        annotatie:
          type: array
          description: Verwijzing naar annotaties die bij de Uitzondering horen. Lijst van Annotatie items.
          items:
            $ref: '#/components/schemas/Annotatie'
          minItems: 1
      required:
        - '@type'
        - datum
        - diagnose
        - oorsprong
        - type
        - omstandigheid
    Annotatie.naam:
      title: Annotatie.naam
      description: Naam van het veld.
      type: string
    Annotatie.waarde:
      title: Annotatie.waarde
      description: De waarde van het veld.
      type: string
    Annotatie:
      title: Annotatie
      type: object
      description: Detailinformatie die meegegeven is bij een Uitzondering.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Annotatie)
          pattern: ^Annotatie$
        naam:
          $ref: '#/components/schemas/Annotatie.naam'
        waarde:
          $ref: '#/components/schemas/Annotatie.waarde'
      required:
        - '@type'
        - naam
        - waarde
    Voertuig.eersteRegistratieDatum:
      title: Voertuig.eersteRegistratieDatum
      description: Eerste datum waarop het voertuig werd geregistreerd in een register.
      type: string
      format: date
    Voertuig:
      title: Voertuig
      type: object
      description: Een voertuig is een apparaat dat ontworpen of gebruikt is om mensen of vracht te vervoeren over land, water, lucht, of door de ruimte.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Voertuig)
          pattern: ^Voertuig$
        eersteRegistratieDatum:
          $ref: '#/components/schemas/Voertuig.eersteRegistratieDatum'
        emissienorm:
          $ref: '#/components/schemas/EuroNormCode'
        vin:
          $ref: '#/components/schemas/Identificator'
        voertuigMotor:
          type: array
          description: De motor of motoren van het Voertuig. Lijst van MotorSpecificatie items.
          items:
            $ref: '#/components/schemas/MotorSpecificatie'
          minItems: 1
      required:
        - '@type'
    MotorSpecificatie:
      title: MotorSpecificatie
      type: object
      description: Informatie over de motor van een Voertuig.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse MotorSpecificatie)
          pattern: ^MotorSpecificatie$
        brandstofType:
          type: array
          description: Het type brandstof dat de motor aandrijft. Lijst van Brandstoftype items.
          items:
            $ref: '#/components/schemas/Brandstoftype'
          minItems: 1
      required:
        - '@type'
        - brandstofType
    Wegenvignetregistratie.registratieDatum:
      title: Wegenvignetregistratie.registratieDatum
      description: Tijdstip waarop de Wegenvignetregistratie werd opgemaakt.
      type: string
      format: date
    Wegenvignetregistratie:
      title: Wegenvignetregistratie
      type: object
      description: Inschrijving van een Voertuig voor een wegenvignet, dat het recht geeft om gedurende een bepaalde periode gebruik te maken van het wegennet.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Wegenvignetregistratie)
          pattern: ^Wegenvignetregistratie$
        registratieDatum:
          $ref: '#/components/schemas/Wegenvignetregistratie.registratieDatum'
        heeftVoertuigregistratie:
          $ref: '#/components/schemas/Registratie'
      required:
        - '@type'
        - heeftVoertuigregistratie
    GestructureerdeIdentificator.lokaleIdentificator:
      title: GestructureerdeIdentificator.lokaleIdentificator
      description: String gebruikt om het object uniek te identificeren binnen de naamruimte.
      type: string
    GestructureerdeIdentificator.versieIdentificator:
      title: GestructureerdeIdentificator.versieIdentificator
      description: Identificator van de specifieke versie van een object.
      type: string
    GestructureerdeIdentificator:
      title: GestructureerdeIdentificator
      type: object
      description: Identificator van een object opgesplitst in zijn onderdelen.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse GestructureerdeIdentificator)
          pattern: ^GestructureerdeIdentificator$
        lokaleIdentificator:
          $ref: '#/components/schemas/GestructureerdeIdentificator.lokaleIdentificator'
        versieIdentificator:
          $ref: '#/components/schemas/GestructureerdeIdentificator.versieIdentificator'
      required:
        - '@type'
        - lokaleIdentificator
    Identificator.identificator:
      title: Identificator.identificator
      description: String gebruikt om het object uniek te identificeren. Type van de string slaat op het identificatiesysteem (inclusief de versie ervan), de string zelf op de eigenlijke identificator.
      type: string
    Identificator:
      title: Identificator
      type: object
      description: Informatie gebruikt om een object uniek te identificeren.
      properties:
        '@id':
          type: string
          format: uri
        '@type':
          type: string
          description: Object type (klasse Identificator)
          pattern: ^Identificator$
        identificator:
          $ref: '#/components/schemas/Identificator.identificator'
        gestructureerdeIdentificator:
          $ref: '#/components/schemas/GestructureerdeIdentificator'
      required:
        - '@type'
  links:
    WegenvignetRegistratieEnvelop.data:
      operationId: WegenvignetRegistratieEnvelopGET
      parameters:
        id: $response.body#/WegenvignetRegistratieEnvelop.data/@id
      description: De waarde van het attribuut `@id` kan gebruikt worden om het gerefereerde object van het type `Wegenvignetregistratie` op te halen.
    WegenvignetRegistratieEnvelop.warning:
      operationId: WegenvignetRegistratieEnvelopGET
      parameters:
        id: $response.body#/WegenvignetRegistratieEnvelop.warning/@id
      description: De waarde van het attribuut `@id` kan gebruikt worden om het gerefereerde object van het type `Uitzondering` op te halen.
    Registratie.nummerplaat:
      operationId: RegistratieGET
      parameters:
        id: $response.body#/Registratie.nummerplaat/@id
      description: De waarde van het attribuut `@id` kan gebruikt worden om het gerefereerde object van het type `Nummerplaat` op te halen.
    Registratie.voertuig:
      operationId: RegistratieGET
      parameters:
        id: $response.body#/Registratie.voertuig/@id
      description: De waarde van het attribuut `@id` kan gebruikt worden om het gerefereerde object van het type `Voertuig` op te halen.
    Nummerplaat.registratienummer:
      operationId: NummerplaatGET
      parameters:
        id: $response.body#/Nummerplaat.registratienummer/@id
      description: De waarde van het attribuut `@id` kan gebruikt worden om het gerefereerde object van het type `Identificator` op te halen.
    Uitzondering.oorsprong:
      operationId: UitzonderingGET
      parameters:
        id: $response.body#/Uitzondering.oorsprong/@id
      description: De waarde van het attribuut `@id` kan gebruikt worden om het gerefereerde object van het type `Concept` op te halen.
    Uitzondering.type:
      operationId: UitzonderingGET
      parameters:
        id: $response.body#/Uitzondering.type/@id
      description: De waarde van het attribuut `@id` kan gebruikt worden om het gerefereerde object van het type `Concept` op te halen.
    Uitzondering.omstandigheid:
      operationId: UitzonderingGET
      parameters:
        id: $response.body#/Uitzondering.omstandigheid/@id
      description: De waarde van het attribuut `@id` kan gebruikt worden om het gerefereerde object van het type `Concept` op te halen.
    Uitzondering.annotatie:
      operationId: UitzonderingGET
      parameters:
        id: $response.body#/Uitzondering.annotatie/@id
      description: De waarde van het attribuut `@id` kan gebruikt worden om het gerefereerde object van het type `Annotatie` op te halen.
    Voertuig.emissienorm:
      operationId: VoertuigGET
      parameters:
        id: $response.body#/Voertuig.emissienorm/@id
      description: De waarde van het attribuut `@id` kan gebruikt worden om het gerefereerde object van het type `EuroNormCode` op te halen.
    Voertuig.vin:
      operationId: VoertuigGET
      parameters:
        id: $response.body#/Voertuig.vin/@id
      description: De waarde van het attribuut `@id` kan gebruikt worden om het gerefereerde object van het type `Identificator` op te halen.
    Voertuig.voertuigMotor:
      operationId: VoertuigGET
      parameters:
        id: $response.body#/Voertuig.voertuigMotor/@id
      description: De waarde van het attribuut `@id` kan gebruikt worden om het gerefereerde object van het type `MotorSpecificatie` op te halen.
    MotorSpecificatie.brandstofType:
      operationId: MotorSpecificatieGET
      parameters:
        id: $response.body#/MotorSpecificatie.brandstofType/@id
      description: De waarde van het attribuut `@id` kan gebruikt worden om het gerefereerde object van het type `Brandstoftype` op te halen.
    Wegenvignetregistratie.heeftVoertuigregistratie:
      operationId: WegenvignetregistratieGET
      parameters:
        id: $response.body#/Wegenvignetregistratie.heeftVoertuigregistratie/@id
      description: De waarde van het attribuut `@id` kan gebruikt worden om het gerefereerde object van het type `Registratie` op te halen.
