title: AfstammingDalendeLijn
type: object
description: Het bloedverwantschap tussen een persoon en kinderen van de persoon.
properties:
  '@id':
    type: string
    format: uri
  '@type':
    type: string
    description: Object type (klasse AfstammingDalendeLijn)
    pattern: ^AfstammingDalendeLijn$
  datumVanAfstamming:
    $ref: '#/components/schemas/AfstammingDalendeLijn.datumVanAfstamming'
  afstammingstype:
    $ref: '#/components/schemas/AfstammingDalendelijnstype'
  metPersoon:
    oneOf:
      - $ref: '#/components/schemas/PersoonReferentie'
      - $ref: '#/components/schemas/GeregistreerdPersoonReferentie'
    discriminator:
      propertyName: '@type'
      mapping:
        PersoonReferentie: '#/components/schemas/PersoonReferentie'
        GeregistreerdPersoonReferentie: '#/components/schemas/GeregistreerdPersoonReferentie'
required:
  - '@type'
  - metPersoon
