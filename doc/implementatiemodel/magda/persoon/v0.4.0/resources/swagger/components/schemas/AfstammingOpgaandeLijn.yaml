title: AfstammingOpgaandeLijn
type: object
description: Het bloedverwantschap tussen een persoon en ouders van de persoon.
properties:
  '@id':
    type: string
    format: uri
  '@type':
    type: string
    description: Object type (klasse AfstammingOpgaandeLijn)
    pattern: ^AfstammingOpgaandeLijn$
  afstammingstype:
    $ref: '#/components/schemas/Afstammingstype'
  datumVanAfstamming:
    $ref: '#/components/schemas/AfstammingOpgaandeLijn.datumVanAfstamming'
  vanPersoon:
    oneOf:
      - $ref: '#/components/schemas/Persoon'
      - $ref: '#/components/schemas/GeregistreerdPersoon'
    discriminator:
      propertyName: '@type'
      mapping:
        Persoon: '#/components/schemas/Persoon'
        GeregistreerdPersoon: '#/components/schemas/GeregistreerdPersoon'
  metPersoon:
    oneOf:
      - $ref: '#/components/schemas/PersoonReferentie'
      - $ref: '#/components/schemas/GeregistreerdPersoonReferentie'
    discriminator:
      propertyName: '@type'
      mapping:
        PersoonReferentie: '#/components/schemas/PersoonReferentie'
        GeregistreerdPersoonReferentie: '#/components/schemas/GeregistreerdPersoonReferentie'
required:
  - '@type'
  - vanPersoon
  - metPersoon
