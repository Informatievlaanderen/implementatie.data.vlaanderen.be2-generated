title: AfstammingOpgaandeLijn
type: object
description: Juridische band tussen een kind en zijn ouder vanuit het standpunt van het kind.
properties:
  '@id':
    type: string
    format: uri
  '@type':
    type: string
    description: Object type (klasse AfstammingOpgaandeLijn)
    pattern: ^AfstammingOpgaandeLijn$
  afstammingstype:
    oneOf:
      - $ref: '#/components/schemas/Afstammingstype'
      - $ref: '#/components/schemas/AfstammingDalendelijnstype'
      - $ref: '#/components/schemas/AfstammingOpgaandelijntype'
    discriminator:
      propertyName: '@type'
      mapping:
        Afstammingstype: '#/components/schemas/Afstammingstype'
        AfstammingDalendelijnstype: '#/components/schemas/AfstammingDalendelijnstype'
        AfstammingOpgaandelijntype: '#/components/schemas/AfstammingOpgaandelijntype'
  metPersoon:
    oneOf:
      - $ref: '#/components/schemas/PersoonReferentie'
      - $ref: '#/components/schemas/GeregistreerdPersoonReferentie'
    discriminator:
      propertyName: '@type'
      mapping:
        PersoonReferentie: '#/components/schemas/PersoonReferentie'
        GeregistreerdPersoonReferentie: '#/components/schemas/GeregistreerdPersoonReferentie'
  datumVanAfstamming:
    $ref: '#/components/schemas/AfstammingOpgaandeLijn.datumVanAfstamming'
required:
  - '@type'
  - metPersoon
