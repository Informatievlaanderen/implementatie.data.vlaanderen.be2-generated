title: AfstammingDalendeLijn
type: object
description: Juridische band tussen een kind en zijn ouder vanuit het standpunt van de ouder.
properties:
  '@id':
    type: string
    format: uri
  '@type':
    type: string
    description: Object type (klasse AfstammingDalendeLijn)
    pattern: ^AfstammingDalendeLijn$
  afstammingstype:
    oneOf:
      - $ref: '#/components/schemas/Afstammingstype'
      - $ref: '#/components/schemas/AfstammingDalendelijnstype'
      - $ref: '#/components/schemas/AfstammingOpgaandelijntype'
    discriminator:
      propertyName: '@type'
      mapping:
        Afstammingstype: '#/components/schemas/Afstammingstype'
        AfstammingDalendelijnstype: '#/components/schemas/AfstammingDalendelijnstype'
        AfstammingOpgaandelijntype: '#/components/schemas/AfstammingOpgaandelijntype'
  metPersoon:
    oneOf:
      - $ref: '#/components/schemas/Persoon'
      - $ref: '#/components/schemas/GeregistreerdPersoon'
    discriminator:
      propertyName: '@type'
      mapping:
        Persoon: '#/components/schemas/Persoon'
        GeregistreerdPersoon: '#/components/schemas/GeregistreerdPersoon'
  datumVanAfstamming:
    $ref: '#/components/schemas/AfstammingDalendeLijn.datumVanAfstamming'
required:
  - '@type'
  - metPersoon
