title: Versie
type: object
description: Entiteit gedurende een bepaalde periode in de databank.
properties:
  '@id':
    type: string
    format: uri
  '@type':
    type: string
    description: Object type (klasse Versie)
    pattern: ^Versie$
  creatiedatum:
    type: object
    description: Datum waarop de gegevens zijn ingevoerd.
    properties:
      '@value':
        type: string
        format: date
      '@type':
        type: string
        pattern: ^Date$
    required:
      - '@value'
      - '@type'
  modificatiedatum:
    type: object
    description: Datum waarop de gegevens werden bijgewerkt.
    properties:
      '@value':
        type: string
        format: date
      '@type':
        type: string
        pattern: ^Date$
    required:
      - '@value'
      - '@type'
  bron:
    $ref: '#/components/schemas/Organisatie'
required:
  - '@type'
