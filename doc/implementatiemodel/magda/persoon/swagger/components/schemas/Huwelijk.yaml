title: Huwelijk
type: object
description: "Een door burgerlijk of religieus recht geregelde\_samenlevingsvorm van twee personen."
properties:
  '@id':
    type: string
    format: uri
  '@type':
    type: string
    description: Object type (klasse Huwelijk)
    pattern: ^Huwelijk$
  plaats:
    $ref: '#/components/schemas/Plaats'
  metPersoon:
    oneOf:
      - $ref: '#/components/schemas/PersoonReferentie'
      - $ref: '#/components/schemas/GeregistreerdPersoonReferentie'
    discriminator:
      propertyName: '@type'
      mapping:
        PersoonReferentie: '#/components/schemas/PersoonReferentie'
        GeregistreerdPersoonReferentie: '#/components/schemas/GeregistreerdPersoonReferentie'
required:
  - '@type'
  - metPersoon
